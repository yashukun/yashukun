<style>
  .blink   { animation: blink 1.1s steps(2, jump-none) infinite; }
  .tw1     { animation: tw 3.2s ease-in-out infinite; }
  .tw2     { animation: tw 4.1s ease-in-out infinite 1.2s; }
  .tw3     { animation: tw 2.6s ease-in-out infinite 0.6s; }
  .led-g   { animation: blink 1.6s steps(2, jump-none) infinite; }
  .led-g2  { animation: blink 2.1s steps(2, jump-none) infinite 0.5s; }
  .led-a   { animation: blink 0.9s steps(2, jump-none) infinite 0.2s; }
  .scan    { animation: scan 7s linear infinite; }
  .chart   { stroke-dasharray: 100; animation: draw 6s linear infinite; }
  .snk     { animation: slither 16s linear infinite; }
  .seg0 { animation: bob 0.9s ease-in-out infinite; }
  .seg1 { animation: bob 0.9s ease-in-out infinite 0.1s; }
  .seg2 { animation: bob 0.9s ease-in-out infinite 0.2s; }
  .seg3 { animation: bob 0.9s ease-in-out infinite 0.3s; }
  .seg4 { animation: bob 0.9s ease-in-out infinite 0.4s; }
  .seg5 { animation: bob 0.9s ease-in-out infinite 0.5s; }
  .seg6 { animation: bob 0.9s ease-in-out infinite 0.6s; }
  .seg7 { animation: bob 0.9s ease-in-out infinite 0.7s; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes blink { 0%,49% {opacity:1} 50%,100% {opacity:0} }
  @keyframes tw    { 0%,100% {opacity:.15} 50% {opacity:.9} }
  @keyframes scan  { 0% {transform:translateY(0)} 100% {transform:translateY(112px)} }
  @keyframes draw  { 0% {stroke-dashoffset:100} 55% {stroke-dashoffset:0} 100% {stroke-dashoffset:0} }
  @keyframes slither { 0% {transform:translateX(-180px)} 100% {transform:translateX(940px)} }
  @keyframes bob   { 0%,100% {transform:translateY(0)} 50% {transform:translateY(-4px)} }
  @keyframes pulse { 0%,100% {opacity:.35} 50% {opacity:1} }
  text { font-family: 'Courier New',Courier,monospace; }
</style>
